services:
  - type: web
    name: ai-interview-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false

